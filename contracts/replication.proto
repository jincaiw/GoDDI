syntax = "proto3";

package goddi.replica.v1;

// Identity comes from mutual TLS and the locally verified role/epoch record.
// These RPCs have no permission to change ownership or activate a node.
service Replication {
  rpc Pull(PullRequest) returns (PullResponse);
  rpc ReportApplied(ReportAppliedRequest) returns (ReportAppliedResponse);
  rpc GetSnapshotManifest(SnapshotRequest) returns (SnapshotManifest);
  rpc ReadSnapshot(ReadSnapshotRequest) returns (stream SnapshotChunk);
}

message Position {
  uint64 epoch = 1;
  uint64 seq = 2;
  bytes hash = 3; // 32 bytes, including for a seq=0 anchor.
}

message Event {
  bytes cluster_id = 1; // UUID raw bytes, 16 bytes.
  Position position = 2;
  bytes leader_id = 3; // UUID raw bytes, 16 bytes.
  uint32 schema_version = 4;
  int64 committed_unix_ms = 5;
  bytes prev_hash = 6;
  bytes payload = 7; // Original UTF-8 JSON bytes.
}

message PullRequest {
  bytes cluster_id = 1;
  Position after = 2;
  uint32 max_events = 3;
  uint32 max_bytes = 4; // Entire protobuf PullResponse, including envelope; hard max 8 MiB.
  repeated uint32 readable_schema_versions = 5;
}

enum PullDisposition {
  PULL_DISPOSITION_UNSPECIFIED = 0;
  BATCH = 1;
  AT_HEAD = 2;
  SNAPSHOT_REQUIRED = 3;
  DIVERGED = 4;
  SCHEMA_INCOMPATIBLE = 5;
  EPOCH_REBASE_REQUIRED = 6; // Administrative rejoin/snapshot; never grants a role.
  REQUEST_BUDGET_TOO_SMALL = 7; // Next event cannot fit; must not skip.
}

message PullResponse {
  PullDisposition disposition = 1;
  repeated Event events = 2;
  Position observed_head = 3; // Telemetry, never a promotion proof.
  uint32 required_bytes = 4; // Only for REQUEST_BUDGET_TOO_SMALL; budget for next event response.
}

message ReportAppliedRequest {
  bytes cluster_id = 1;
  Position applied = 2; // Locally committed; current epoch, matching hash, monotone.
}
message ReportAppliedResponse {}

message SnapshotRequest {
  bytes cluster_id = 1;
  repeated uint32 readable_schema_versions = 2;
}

message SnapshotManifest {
  bytes cluster_id = 1;
  bytes snapshot_id = 2;
  bytes leader_id = 3;
  uint32 schema_version = 4;
  Position anchor = 5;
  repeated ChunkSpec chunks = 6;
  int64 retention_until_unix_ms = 7;
  repeated TableCount table_counts = 8;
  uint64 total_bytes = 9; // Checked against local configured aggregate limit before staging.
  SnapshotEncoding encoding = 10;
}
enum SnapshotEncoding {
  SNAPSHOT_ENCODING_UNSPECIFIED = 0;
  LOGICAL_NDJSON_V1 = 1;
}
message TableCount { string table_name = 1; uint64 row_count = 2; }
message ChunkSpec { uint32 index = 1; uint64 size_bytes = 2; bytes sha256 = 3; }
message ReadSnapshotRequest { bytes snapshot_id = 1; uint32 from_chunk = 2; }
message SnapshotChunk { uint32 index = 1; bytes data = 2; } // Raw body <= 1 MiB.
