name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Run Go tests
        run: go test -race ./...

      - name: Run Go vet
        run: go vet ./...

      # L3: exercise the DNS data plane (UDP/TCP listeners) inside CI
      # instead of only testing with DNS disabled.
      - name: DNS integration test (dig)
        env:
          GODDI_SERVER_HTTP_ADDR: 127.0.0.1:16090
          GODDI_SERVER_PUBLIC_URL: http://127.0.0.1:16090
          GODDI_SERVER_DATA_DIR: /tmp/goddi-dns-ci
          GODDI_DATABASE_DSN: /tmp/goddi-dns-ci/goddi.db
          GODDI_SECURITY_JWT_SECRET: ci-only-secret-not-for-production-123456
          GODDI_ADMIN_USERNAME: admin
          GODDI_ADMIN_PASSWORD: Admin@123456
          GODDI_DNS_ENABLED: 'true'
          GODDI_DNS_LISTENERS_UDP_ADDR: '127.0.0.1:15353'
          GODDI_DNS_LISTENERS_TCP_ADDR: '127.0.0.1:15353'
          GODDI_DHCP_ENABLED: 'false'
        run: |
          go build -o /tmp/goddi-dns-server ./cmd/goddi
          /tmp/goddi-dns-server serve > /tmp/goddi-dns.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat /tmp/goddi-dns.log' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:16090/health > /dev/null; then break; fi
            sleep 1
          done

          # Login and create a test zone + A record via the API.
          login=$(curl -fsS -X POST http://127.0.0.1:16090/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"Admin@123456"}')
          token=$(printf '%s' "$login" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["token"])')
          csrf=$(printf '%s' "$login" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["csrf_token"])')
          auth=(-H "Authorization: Bearer $token" -H "X-CSRF-Token: $csrf" -H 'Content-Type: application/json')

          curl -fsS -X POST http://127.0.0.1:16090/api/v1/dns/zones "${auth[@]}" \
            -d '{"name":"ci.test","type":"forward","enabled":true}' > /dev/null || true
          zone_id=$(curl -fsS http://127.0.0.1:16090/api/v1/dns/zones "${auth[@]}" | \
            python3 -c 'import json,sys; d=json.load(sys.stdin); zs=d.get("data",d); items=zs if isinstance(zs,list) else zs.get("items",zs); print(next(z["id"] for z in items if z["name"].rstrip(".")=="ci.test"))')
          curl -fsS -X POST "http://127.0.0.1:16090/api/v1/dns/zones/${zone_id}/records" "${auth[@]}" \
            -d '{"name":"www.ci.test","type":"A","value":"192.0.2.10","ttl":300}' > /dev/null

          # UDP answer must contain the record value. Retry briefly:
          # the zone store may reload asynchronously after the API write.
          for attempt in $(seq 1 10); do
            if dig +time=3 +tries=1 @127.0.0.1 -p 15353 www.ci.test A +short | grep -qx '192.0.2.10'; then
              udp_ok=1; break
            fi
            sleep 1
          done
          [ "${udp_ok:-0}" = "1" ] || { echo "UDP answer missing/incorrect"; exit 1; }
          # TCP answer must succeed as well.
          for attempt in $(seq 1 10); do
            if dig +time=3 +tries=1 +tcp @127.0.0.1 -p 15353 www.ci.test A +short | grep -qx '192.0.2.10'; then
              tcp_ok=1; break
            fi
            sleep 1
          done
          [ "${tcp_ok:-0}" = "1" ] || { echo "TCP answer missing/incorrect"; exit 1; }
          echo "DNS integration test passed"

      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Browser and API regression tests
        env:
          GODDI_SERVER_HTTP_ADDR: 127.0.0.1:16090
          GODDI_SERVER_PUBLIC_URL: http://127.0.0.1:16090
          GODDI_SERVER_DATA_DIR: /tmp/goddi-ci
          GODDI_DATABASE_DSN: /tmp/goddi-ci/goddi.db
          GODDI_SECURITY_JWT_SECRET: ci-only-secret-not-for-production-123456
          GODDI_ADMIN_USERNAME: admin
          GODDI_ADMIN_PASSWORD: Admin@123456
          GODDI_DNS_ENABLED: 'false'
          GODDI_DHCP_ENABLED: 'false'
        run: |
          go build -o /tmp/goddi-ci-server ./cmd/goddi
          /tmp/goddi-ci-server serve > /tmp/goddi-ci.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat /tmp/goddi-ci.log' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:16090/health; then break; fi
            sleep 1
          done
          cd web
          npx playwright test

  # L2: static linting. Conservative linter set (see .golangci.yml).
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: golangci-lint
        # v7 is required for golangci-lint v2 (v6 only supports v1).
        uses: golangci/golangci-lint-action@v7
        with:
          # Pinned: "latest" resolved to a binary built with Go 1.24,
          # which refuses configs targeting go 1.26.6.
          version: v2.13.2

  # L2: dependency vulnerability scan against the Go vulnerability DB.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
