name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web-admin/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web-admin
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Sync frontend dist into embed directory
        run: |
          rm -rf web/dist
          mkdir -p web/dist
          cp -R web-admin/dist/. web/dist/

      - name: Run Go tests
        run: go test -race ./...

      - name: Run Go vet
        run: go vet ./...

      # L3: exercise the DNS data plane (UDP/TCP listeners) inside CI
      # instead of only testing with DNS disabled.
      - name: DNS integration test (dig)
        env:
          GODDI_SERVER_HTTP_ADDR: 127.0.0.1:16090
          GODDI_SERVER_PUBLIC_URL: http://127.0.0.1:16090
          GODDI_SERVER_DATA_DIR: /tmp/goddi-dns-ci
          GODDI_DATABASE_DSN: /tmp/goddi-dns-ci/goddi.db
          GODDI_SECURITY_JWT_SECRET: ci-only-secret-not-for-production-123456
          GODDI_ADMIN_USERNAME: admin
          GODDI_ADMIN_PASSWORD: Admin@123456
          GODDI_DNS_ENABLED: 'true'
          GODDI_DNS_LISTENERS_UDP_ADDR: '127.0.0.1:15353'
          GODDI_DNS_LISTENERS_TCP_ADDR: '127.0.0.1:15353'
          GODDI_DHCP_ENABLED: 'false'
        run: |
          go build -o /tmp/goddi-dns-server ./cmd/goddi
          /tmp/goddi-dns-server serve > /tmp/goddi-dns.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat /tmp/goddi-dns.log' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:16090/health > /dev/null; then break; fi
            sleep 1
          done

          # Login and create a test zone + A record via the API.
          login=$(curl -fsS -X POST http://127.0.0.1:16090/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"Admin@123456"}')
          token=$(printf '%s' "$login" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["token"])')
          csrf=$(printf '%s' "$login" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["csrf_token"])')
          auth=(-H "Authorization: Bearer $token" -H "X-CSRF-Token: $csrf" -H 'Content-Type: application/json')

          curl -fsS -X POST http://127.0.0.1:16090/api/v1/dns/zones "${auth[@]}" \
            -d '{"name":"ci.test","type":"forward","enabled":true}' > /dev/null || true
          zone_id=$(curl -fsS http://127.0.0.1:16090/api/v1/dns/zones "${auth[@]}" | \
            python3 -c 'import json,sys; d=json.load(sys.stdin); zs=d.get("data",d); items=zs if isinstance(zs,list) else zs.get("items",zs); print(next(z["id"] for z in items if z["name"].rstrip(".")=="ci.test"))')
          curl -fsS -X POST "http://127.0.0.1:16090/api/v1/dns/zones/${zone_id}/records" "${auth[@]}" \
            -d '{"name":"www.ci.test","type":"A","value":"192.0.2.10","ttl":300}' > /dev/null

          # UDP answer must contain the record value. Retry briefly:
          # the zone store may reload asynchronously after the API write.
          for attempt in $(seq 1 10); do
            if dig +time=3 +tries=1 @127.0.0.1 -p 15353 www.ci.test A +short | grep -qx '192.0.2.10'; then
              udp_ok=1; break
            fi
            sleep 1
          done
          [ "${udp_ok:-0}" = "1" ] || { echo "UDP answer missing/incorrect"; exit 1; }
          # TCP answer must succeed as well.
          for attempt in $(seq 1 10); do
            if dig +time=3 +tries=1 +tcp @127.0.0.1 -p 15353 www.ci.test A +short | grep -qx '192.0.2.10'; then
              tcp_ok=1; break
            fi
            sleep 1
          done
          [ "${tcp_ok:-0}" = "1" ] || { echo "TCP answer missing/incorrect"; exit 1; }
          echo "DNS integration test passed"

      # The HTTP/API suite in test/. It was written long ago but no job ran it,
      # so a stale assertion (an unauthenticated /metrics) sat green-by-default
      # for as long as nobody executed it. Running it here, against a real
      # process, is the only way it can fail.
      - name: API integration suite
        env:
          GODDI_SERVER_HTTP_ADDR: 127.0.0.1:16091
          GODDI_SERVER_PUBLIC_URL: http://127.0.0.1:16091
          GODDI_SERVER_DATA_DIR: /tmp/goddi-api-ci
          GODDI_DATABASE_DSN: /tmp/goddi-api-ci/goddi.db
          GODDI_SECURITY_JWT_SECRET: ci-only-secret-not-for-production-123456
          GODDI_ADMIN_USERNAME: admin
          GODDI_ADMIN_PASSWORD: Admin@123456
          GODDI_DNS_ENABLED: 'false'
          GODDI_DHCP_ENABLED: 'false'
          GODDI_TEST_BASE_URL: http://127.0.0.1:16091
        run: |
          rm -rf /tmp/goddi-api-ci
          mkdir -p /tmp/goddi-api-ci
          go build -o /tmp/goddi-api-server ./cmd/goddi
          /tmp/goddi-api-server serve > /tmp/goddi-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat /tmp/goddi-api.log' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:16091/health > /dev/null; then break; fi
            sleep 1
          done
          go run ./test

      - name: Install browser
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      # The specs that bring their own state. This runs `npx playwright test`,
      # which excludes the *.fixture.spec.ts set (playwright.config.ts).
      - name: Browser and API regression tests
        env:
          GODDI_SERVER_HTTP_ADDR: 127.0.0.1:16090
          GODDI_SERVER_PUBLIC_URL: http://127.0.0.1:16090
          GODDI_SERVER_DATA_DIR: /tmp/goddi-ci
          GODDI_DATABASE_DSN: /tmp/goddi-ci/goddi.db
          GODDI_SECURITY_JWT_SECRET: ci-only-secret-not-for-production-123456
          GODDI_ADMIN_USERNAME: admin
          GODDI_ADMIN_PASSWORD: Admin@123456
          GODDI_DNS_ENABLED: 'false'
          GODDI_DHCP_ENABLED: 'false'
        run: |
          go build -o /tmp/goddi-ci-server ./cmd/goddi
          /tmp/goddi-ci-server serve > /tmp/goddi-ci.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat /tmp/goddi-ci.log' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:16090/health; then break; fi
            sleep 1
          done
          cd e2e
          npx playwright test

      # ...and the specs that need the instance to be *given* its fixtures.
      # Two sets, two instances: the fixture specs assume a seeded world (an
      # address with a DNS record, a materialised /24, a sparse /15) while the
      # suite above assumes a table it alone has written to, so one instance
      # cannot serve both. The seed is scripts/w13_frontend_smoke.py -- the
      # recipe the fixture specs were written against -- so the environment
      # under test cannot drift from it. This step existed only as a local
      # instruction before, which is why the fixture specs were green here.
      - name: Browser regression tests (seeded fixtures)
        env:
          GODDI_SMOKE_PORT: '16092'
          GODDI_TEST_BASE_URL: http://127.0.0.1:16092
        run: |
          python3 scripts/w13_frontend_smoke.py up
          status=0
          (cd e2e && npx playwright test --config playwright.fixture.config.ts) || status=$?
          python3 scripts/w13_frontend_smoke.py down || true
          if [ "$status" != "0" ]; then
            # The instance's own log, not the browser's: a seed that failed to
            # start is the failure most worth seeing, and `down` has already
            # stopped the process by now.
            log="$(python3 -c 'import tempfile,os;print(os.path.join(tempfile.gettempdir(),"goddi-w13-smoke.log"))')"
            if [ -f "$log" ]; then cat "$log"; fi
          fi
          exit "$status"

  # L2: static linting. Conservative linter set (see .golangci.yml).
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: golangci-lint
        # v7 is required for golangci-lint v2 (v6 only supports v1).
        uses: golangci/golangci-lint-action@v7
        with:
          # Pinned: "latest" resolved to a binary built with Go 1.24,
          # which refuses configs targeting go 1.26.6.
          version: v2.13.2

  # L2: dependency vulnerability scan against the Go vulnerability DB.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
