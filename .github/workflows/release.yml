name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Run Go tests
        run: go test ./...

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
          GIT_COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ github.run_started_at }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64; do
            goos=${target%/*}
            goarch=${target#*/}
            out="dist/goddi-${VERSION}-${goos}-${goarch}"
            echo "Building $out"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build \
              -ldflags "-X main.Version=${VERSION} -X main.GitCommit=${GIT_COMMIT} -X main.BuildDate=${BUILD_DATE}" \
              -o "$out" ./cmd/goddi
          done
          cd dist
          sha256sum goddi-${VERSION}-linux-amd64 goddi-${VERSION}-linux-arm64 > "SHA256SUMS-${VERSION}.txt"
          cat "SHA256SUMS-${VERSION}.txt"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/goddi-${{ github.ref_name }}-linux-amd64
            dist/goddi-${{ github.ref_name }}-linux-arm64
            dist/SHA256SUMS-${{ github.ref_name }}.txt
