env: development
server:
  name: "GoDDI"
  http_addr: ":6080"
  public_url: "http://127.0.0.1:6080"
  data_dir: /var/lib/goddi
  role: all
database:
  driver: "sqlite"
  dsn: /var/lib/goddi/goddi.db
dataplane:
  sync_interval_seconds: 1
dns:
  enabled: true
  listeners:
    udp: {enabled: true, address: ":53"}
    tcp: {enabled: true, address: ":53"}
dhcp:
  enabled: true
  interfaces: []
  lease_store: wal
  trusted_relay_cidrs: ["10.77.3.0/24"]
  renew_out_of_pool_policy: "allow"
security:
  # TSIG secrets are sealed with this key; without it a TSIG key cannot be
  # created at all (the store refuses to keep a secret in the clear).
  encryption_key: "h2-acceptance-encryption-key-0123456789"
  totp_enabled: false
  login_rate_limit: 5
dhcp_ha:
  enabled: true
  node_id: "h2-node-a"
  role: "primary"
  listen_addr: "10.77.2.11:9953"
  peer_address: "10.77.2.12:9953"
  peer_token: "h2-peer-token-0123456789"
  confirm_timeout: 1s
  heartbeat_interval: 2s
  peer_stale_after: 5s
  tls_cert_file: /etc/goddi/certs/h2-node-a.crt
  tls_key_file: /etc/goddi/certs/h2-node-a.key
  tls_ca_file: /etc/goddi/certs/ca.crt
  tls_server_name: "10.77.2.12"

log:
  level: debug

cluster:
  node_name: h2-node-a
  config_author: true
