env: development
server:
  name: "GoDDI"
  http_addr: ":6080"
  public_url: "http://127.0.0.1:6080"
  data_dir: /var/lib/goddi
  role: all
database:
  driver: "sqlite"
  dsn: /var/lib/goddi/goddi.db
dataplane:
  sync_interval_seconds: 1
dns:
  enabled: true
  # Lab-only: exercise the experimental DNSSEC key lifecycle through the GUI.
  dnssec:
    enabled: true
  listeners:
    udp: {enabled: true, address: ":53"}
    tcp: {enabled: true, address: ":53"}
dhcp:
  enabled: true
  interfaces: []
  lease_store: wal
  trusted_relay_cidrs: ["10.77.3.0/24"]
  renew_out_of_pool_policy: "allow"
security:
  # TSIG secrets are sealed with this key; without it a TSIG key cannot be
  # created at all (the store refuses to keep a secret in the clear).
  encryption_key: "h2-acceptance-encryption-key-0123456789"
  totp_enabled: false
  login_rate_limit: 5
dhcp_ha:
  enabled: true
  node_id: "h2-node-b"
  role: "standby"
  listen_addr: "10.77.2.12:9953"
  peer_address: "10.77.2.11:9953"
  peer_token: "h2-peer-token-0123456789"
  confirm_timeout: 1s
  heartbeat_interval: 2s
  peer_stale_after: 5s
  # ADR-0012：双心跳链路（第二条网线）与默认关闭的自动提升。
  # listen_addr_backup / peer_address_backup 由部署按第二网络填写；默认留空=单链路。
  # auto_failover 默认 false：备永不自我提升，保持 fail-closed（ADR-0003/0010）。
  priority: 10
  preempt: false
  auto_failover: false
  tls_cert_file: /etc/goddi/certs/h2-node-b.crt
  tls_key_file: /etc/goddi/certs/h2-node-b.key
  tls_ca_file: /etc/goddi/certs/ca.crt
  tls_server_name: "10.77.2.11"

log:
  level: debug

# ADR-0005 single-author rule: node-a authors configuration, node-b does not.
# Configuration writes on node-b are refused (409) instead of producing a second
# divergent revision; reads and both data planes keep working.
cluster:
  node_name: h2-node-b
  config_author: false