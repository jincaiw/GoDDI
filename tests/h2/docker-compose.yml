name: goddi-h2
x-env: &env
  GODDI_SECURITY_JWT_SECRET: "h2-exercise-jwt-secret-not-for-production"
  GODDI_ADMIN_USERNAME: "admin"
  GODDI_ADMIN_PASSWORD: "AdminPass-0123456789"
  GODDI_LOG_LEVEL: info
  # Lab-only: exercise the already-shipped D-03 facts hash chain end to end.
  GODDI_DHCP_FACTS_HASH_CHAIN_ENABLED: "true"

services:
  node-a:
    container_name: node-a
    image: goddi:h2
    build:
      context: ../..
      dockerfile: tests/h2/Dockerfile
    hostname: h2-node-a
    networks:
      mgmt-net: {}
      repl-net:
        ipv4_address: 10.77.2.11
      client-net: {}
    volumes:
      - node-a-data:/var/lib/goddi
      - ./config/node-a.yaml:/etc/goddi/config.yaml:ro
      - ./certs:/etc/goddi/certs:ro
      - ./scripts/entrypoint.sh:/h2-entry.sh:ro
    environment:
      <<: *env
    entrypoint: ["/bin/sh", "/h2-entry.sh"]
    cap_add: [NET_RAW, NET_ADMIN]
    ports:
      - "18181:6080"
      - "15454:53/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:6080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  node-b:
    container_name: node-b
    image: goddi:h2
    hostname: h2-node-b
    networks:
      mgmt-net: {}
      repl-net:
        ipv4_address: 10.77.2.12
      client-net: {}
    volumes:
      - node-b-data:/var/lib/goddi
      - ./config/node-b.yaml:/etc/goddi/config.yaml:ro
      - ./certs:/etc/goddi/certs:ro
      - ./scripts/entrypoint.sh:/h2-entry.sh:ro
    environment:
      <<: *env
    entrypoint: ["/bin/sh", "/h2-entry.sh"]
    cap_add: [NET_RAW, NET_ADMIN]
    ports:
      - "18182:6080"
      - "15455:53/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:6080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  client:
    container_name: client
    image: alpine:3.24
    hostname: h2-client
    networks: [client-net]
    cap_add: [NET_RAW, NET_ADMIN]
    command: ["sh","-c","sleep infinity"]

  relay:
    container_name: relay
    image: alpine:3.24
    hostname: h2-relay
    networks:
      client-net: {}
      mgmt-net: {}
    cap_add: [NET_RAW, NET_ADMIN]
    command: ["sh","-c","sleep infinity"]

  fault-injector:
    container_name: fault-injector
    image: alpine:3.24
    hostname: h2-fault-injector
    networks:
      mgmt-net: {}
      repl-net: {}
      client-net: {}
    cap_add: [NET_RAW, NET_ADMIN, SYS_ADMIN]
    command: ["sh","-c","sleep infinity"]

  observer:
    container_name: observer
    image: alpine:3.24
    hostname: h2-observer
    networks:
      mgmt-net: {}
    command: ["sh","-c","sleep infinity"]

networks:
  mgmt-net:
    ipam: {config: [{subnet: 10.77.1.0/24}]}
  repl-net:
    ipam: {config: [{subnet: 10.77.2.0/24}]}
  client-net:
    ipam: {config: [{subnet: 10.77.3.0/24}]}

volumes:
  node-a-data:
  node-b-data:
