# GoDDI golangci-lint configuration (L2).
# Conservative set: the same checks `go vet` performs plus high-signal
# static analysis. errcheck is intentionally omitted because the codebase
# deliberately ignores a few fire-and-forget Exec calls (backup status
# updates); revisit if the codebase adopts a strict error-handling policy.
version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
  settings:
    staticcheck:
      # QF* are stylistic "quickfix" suggestions (tagged switches,
      # fmt.Fprintf rewrites, ...). ST* are style checks (package
      # comments, naming conventions) with substantial pre-existing debt.
      # Policy: keep correctness checks (SA*, S*), revisit style in a
      # dedicated cleanup pass.
      checks:
        - all
        - -QF*
        - -ST*

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
